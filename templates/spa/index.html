{% load static %}
<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Ventas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'spa/styles.css' %}" rel="stylesheet">
</head>
<body>
  <div id="alert-container" aria-live="polite"></div>

  <section id="login-section" class="container d-none">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card shadow-sm login-card">
          <div class="card-body p-4">
            <h1 class="h4 text-center mb-1">Control de Ventas</h1>
            <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>
            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="login-username" class="form-label">Usuario</label>
                <input type="text" id="login-username" class="form-control" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label for="login-password" class="form-label">Contraseña</label>
                <input type="password" id="login-password" class="form-control" autocomplete="current-password" required>
              </div>
              <button type="submit" id="login-submit" class="btn btn-primary w-100">
                <span id="login-spinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                <span id="login-label">Ingresar</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="app-section" class="d-none">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
      <div class="container">
        <span class="navbar-brand">Control de Ventas</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="#products" data-route="products">Productos</a></li>
            <li class="nav-item"><a class="nav-link" href="#sales" data-route="sales">Ventas</a></li>
            <li class="nav-item"><a class="nav-link" href="#new-sale" data-route="new-sale">Nueva venta</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="navbar-text" id="nav-username"></span>
            <button type="button" id="logout-button" class="btn btn-outline-light btn-sm">Salir</button>
          </div>
        </div>
      </div>
    </nav>
    <main class="container pb-5" id="view"></main>
  </section>

  <div class="modal fade" id="sale-modal" tabindex="-1" aria-labelledby="sale-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="sale-modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="sale-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'spa/app.js' %}"></script>
</body>
</html>
