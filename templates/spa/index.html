{% load static %}
<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Ventas | Inteligencia Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'spa/styles.css' %}" rel="stylesheet">
</head>
<body>
  <div id="alert-container" aria-live="polite"></div>

  <section id="login-section" class="login-wrapper d-none">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-6 col-lg-4">
          <div class="card login-card border-0">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="brand-badge mx-auto mb-3">
                  <i class="bi bi-graph-up-arrow"></i>
                </div>
                <h1 class="h4 fw-bold mb-1">Control de Ventas</h1>
                <p class="text-muted small mb-0">Plataforma de gestión comercial e inteligencia de inventario</p>
              </div>
              <form id="login-form" novalidate>
                <div class="mb-3">
                  <label for="login-username" class="form-label fw-medium small">Usuario</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" id="login-username" class="form-control border-start-0 ps-0" autocomplete="username" placeholder="Ingresa tu usuario" required>
                  </div>
                </div>
                <div class="mb-4">
                  <label for="login-password" class="form-label fw-medium small">Contraseña</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" id="login-password" class="form-control border-start-0 ps-0" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
                  </div>
                </div>
                <button type="submit" id="login-submit" class="btn btn-brand w-100 py-2 fw-semibold">
                  <span id="login-spinner" class="spinner-border spinner-border-sm me-1 d-none" aria-hidden="true"></span>
                  <span id="login-label">Ingresar al sistema</span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="app-section" class="d-none">
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top mb-4">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#dashboard" data-route="dashboard">
          <span class="nav-brand-icon"><i class="bi bi-graph-up-arrow"></i></span>
          <span>Control de Ventas</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto gap-1 mt-2 mt-lg-0">
            <li class="nav-item">
              <a class="nav-link rounded-3 px-3" href="#dashboard" data-route="dashboard">
                <i class="bi bi-speedometer2 me-1"></i>Dashboard IA
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link rounded-3 px-3" href="#products" data-route="products">
                <i class="bi bi-box-seam me-1"></i>Productos
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link rounded-3 px-3" href="#sales" data-route="sales">
                <i class="bi bi-receipt me-1"></i>Ventas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link rounded-3 px-3" href="#new-sale" data-route="new-sale">
                <i class="bi bi-cart-plus me-1"></i>Nueva venta
              </a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
            <span class="user-pill" id="nav-username"></span>
            <button type="button" id="logout-button" class="btn btn-outline-light btn-sm px-3 rounded-3">
              <i class="bi bi-box-arrow-right me-1"></i>Salir
            </button>
          </div>
        </div>
      </div>
    </nav>
    <main class="container pb-5" id="view"></main>
  </section>

  <div class="modal fade" id="sale-modal" tabindex="-1" aria-labelledby="sale-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-bottom-0 pb-0">
          <h2 class="modal-title h5 fw-bold" id="sale-modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body" id="sale-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="{% static 'spa/es04_dashboard.js' %}"></script>
  <script src="{% static 'spa/app.js' %}"></script>
</body>
</html>
